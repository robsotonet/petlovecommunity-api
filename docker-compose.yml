# docker-compose.yml
version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: petlove-db
    environment:
      POSTGRES_DB: petlove_dev
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ~/Developer/Data/Postgres/PetLove:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - petlove-network

  # Redis for caching and session management
  redis:
    image: redis:7-alpine
    container_name: petlove-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - petlove-network

  # API Service (for production-like testing)
  api:
    build:
      context: .
      dockerfile: src/backend/PetLoveCommunity.API/Dockerfile
    container_name: petlove-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=petlove_dev;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - ConnectionStrings__Redis=redis:6379
      - JWT__SecretKey=${JWT_KEY}
      - JWT__Issuer=${JWT_ISSUER}
      - JWT__Audience=${JWT_AUDIENCE}
    ports:
      - "5000:5000"
    depends_on:
      - db
      - redis
    networks:
      - petlove-network
    volumes:
      - ./uploads:/app/uploads

  # pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: petlove-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@petlove.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - petlove-network

volumes:
  redis_data:

networks:
  petlove-network:
    driver: bridge